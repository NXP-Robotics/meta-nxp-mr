CONFIG_DEFAULT_DEVICE_TREE="imx95-navqa"
CONFIG_DEFAULT_FDT_FILE="imx95-navqa.dtb"
CONFIG_NVME_PCI=y
CONFIG_SPL_STACK=0x88296000
CONFIG_SPL_BSS_START_ADDR=0x88296000
CONFIG_SPL_BSS_MAX_SIZE=0x2000
CONFIG_SPL_TEXT_BASE=0x88240000
# U-Boot text and early stack must stay out of the 0x90000000-0x914FFFFF M7 window
CONFIG_TEXT_BASE=0x91600000
# INIT_SP_RELATIVE can't be used: its ADR only reaches 1MB and U-Boot is larger
CONFIG_HAS_CUSTOM_SYS_INIT_SP_ADDR=y
CONFIG_CUSTOM_SYS_INIT_SP_ADDR=0x91A00000
CONFIG_TARGET_IMX95_NAVQA=y
